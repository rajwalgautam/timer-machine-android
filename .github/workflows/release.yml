name: Release APK

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android
        uses: ./.github/actions/android-setup

      - name: Build Debug APK
        run: ./gradlew app:assembleDogDebug

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          body: "See [CHANGELOG.md](https://github.com/rajwalgautam/timer-machine-android/blob/main/CHANGELOG.md)"
          files: app/build/outputs/apk/dog/debug/*.apk
